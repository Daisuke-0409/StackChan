# The suites run on every push, so a regression is found by the repository
# rather than by a robot going quiet three days later.
#
# One step, calling the same runner run_tests.ps1 calls. Listing the suites
# here instead would let CI and the local command drift apart, and it would
# reintroduce the failure this repository has already had once: `unittest
# discover` exits 0 when it finds nothing, so a suite that stopped being
# collected would show up here as a green tick. tools/run_suites.py treats
# "Ran 0 tests" as the breakage it is.
#
# No pip install step, deliberately. All suites pass on a bare standard
# library -- every heavy import (torch, cv2, playwright, sounddevice) sits
# inside the function that needs it. Verified 2026-08-22 by running them
# with those packages blocked at the import hook. If a test ever needs a
# real dependency, that is worth noticing here rather than quietly adding
# it: it means an import moved to module scope, which also changes what a
# launcher needs.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the interpreter the launchers pick at home
      - run: python tools/run_suites.py
